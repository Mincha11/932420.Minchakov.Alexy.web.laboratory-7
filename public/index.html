
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог фильмов</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
            background: #f4f4f4;
        }

        h1, h2 {
            text-align: center;
        }

        form, .filters {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        input {
            max-width: 180px;
        }

        button {
            cursor: pointer;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #e5e5e5;
        }

        #message {
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Каталог фильмов</h1>

    <h2>Добавить фильм</h2>

    <form id="movieForm">
        <input id="title" placeholder="Название фильма" required>
        <input id="genre" placeholder="Жанр" required>
        <input id="rating" type="number" min="0" max="10"
               step="0.1" placeholder="Рейтинг" required>
        <input id="year" type="number" step="1"
               placeholder="Год выпуска" required>

        <button type="submit">Сохранить фильм</button>
    </form>

    <div class="filters">
        <h2>Фильтрация</h2>

        <input id="filterGenre" placeholder="Жанр">
        <input id="filterRating" type="number" min="0" max="10"
               step="0.1" placeholder="Минимальный рейтинг">

        <button onclick="loadMovies()">Найти</button>
        <button onclick="resetFilters()">Сбросить</button>
    </div>

    <p id="message"></p>

    <h2>Список фильмов</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Жанр</th>
                <th>Рейтинг</th>
                <th>Год</th>
                <th>Действия</th>
            </tr>
        </thead>

        <tbody id="moviesList"></tbody>
    </table>

    <script>
        const form = document.getElementById("movieForm");
        const message = document.getElementById("message");

        // Загрузка списка фильмов
        async function loadMovies() {
            const genre = document.getElementById("filterGenre").value;
            const minRating = document.getElementById("filterRating").value;

            const params = new URLSearchParams();

            if (genre.trim()) params.append("genre", genre.trim());
            if (minRating !== "") params.append("minRating", minRating);

            try {
                const response = await fetch(
                    "/api/movies?" + params.toString()
                );

                const movies = await response.json();

                if (!response.ok) {
                    throw new Error(movies.error);
                }

                const list = document.getElementById("moviesList");
                list.innerHTML = "";

                movies.forEach(movie => {
                    const row = document.createElement("tr");

                    [
                        movie.id,
                        movie.title,
                        movie.genre,
                        movie.rating,
                        movie.release_year
                    ].forEach(value => {
                        const cell = document.createElement("td");
                        cell.textContent = value;
                        row.appendChild(cell);
                    });

                    const actions = document.createElement("td");

                    const editButton = document.createElement("button");
                    editButton.textContent = "Изменить";
                    editButton.onclick = () => editMovie(movie);

                    const deleteButton = document.createElement("button");
                    deleteButton.textContent = "Удалить";
                    deleteButton.onclick = () => deleteMovie(movie.id);

                    actions.append(editButton, deleteButton);
                    row.appendChild(actions);
                    list.appendChild(row);
                });

                message.textContent = "Фильмы загружены";
            } catch (error) {
                message.textContent = "Ошибка: " + error.message;
            }
        }

        // Добавление фильма
        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const movie = {
                title: document.getElementById("title").value,
                genre: document.getElementById("genre").value,
                rating: Number(document.getElementById("rating").value),
                release_year: Number(document.getElementById("year").value)
            };

            try {
                const response = await fetch("/api/movies", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(movie)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error);
                }

                message.textContent = data.message;
                form.reset();
                loadMovies();
            } catch (error) {
                message.textContent = "Ошибка: " + error.message;
            }
        });

        // Изменение фильма
        async function editMovie(movie) {
            const title = prompt("Новое название:", movie.title);
            if (title === null) return;

            const genre = prompt("Новый жанр:", movie.genre);
            if (genre === null) return;

            const rating = prompt("Новый рейтинг:", movie.rating);
            if (rating === null) return;

            const year = prompt("Новый год выпуска:", movie.release_year);
            if (year === null) return;

            try {
                const response = await fetch(`/api/movies/${movie.id}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        title,
                        genre,
                        rating: Number(rating),
                        release_year: Number(year)
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error);
                }

                message.textContent = data.message;
                loadMovies();
            } catch (error) {
                message.textContent = "Ошибка: " + error.message;
            }
        }

        // Удаление фильма
        async function deleteMovie(id) {
            if (!confirm("Удалить этот фильм?")) return;

            try {
                const response = await fetch(`/api/movies/${id}`, {
                    method: "DELETE"
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error);
                }

                message.textContent = data.message;
                loadMovies();
            } catch (error) {
                message.textContent = "Ошибка: " + error.message;
            }
        }

        // Сброс фильтров
        function resetFilters() {
            document.getElementById("filterGenre").value = "";
            document.getElementById("filterRating").value = "";
            loadMovies();
        }

        // Загружаем фильмы при открытии страницы
        loadMovies();
    </script>

</body>
</html>
